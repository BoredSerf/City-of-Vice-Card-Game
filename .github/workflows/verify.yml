name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPAMJOBS: "1"
      DUNEJOBS: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require resolved dependency locks
        run: |
          test -s package-lock.json
          test -s city_of_vice.opam.locked
          test -s toolchain/opam-repository.rev
      - name: Install Linux build and sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap build-essential curl git patch pkg-config rsync unzip
      - name: Install verified opam
        run: |
          mkdir -p "$RUNNER_TEMP/s02-bin"
          curl --fail --location --silent --show-error https://github.com/ocaml/opam/releases/download/2.6.1/opam-2.6.1-x86_64-linux --output "$RUNNER_TEMP/s02-bin/opam"
          echo "b533d393a6967150d6ef41cb3d71e147e93ecbabeb59e921aa412c0ae79ebe3d  $RUNNER_TEMP/s02-bin/opam" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/s02-bin/opam"
          echo "$RUNNER_TEMP/s02-bin" >> "$GITHUB_PATH"
      - name: Bootstrap locked dependencies
        run: npm run bootstrap
      - name: Install browser system prerequisites
        run: node node_modules/playwright/cli.js install-deps chromium
      - name: Explicitly install the pinned browser
        run: npm run browser:install
      - name: Verify every available foundation check
        run: npm run verify
